<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Club Membership</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form action="" class="form-section">
        <h2>فرم درخواست عضویت</h2>
        <hr>
        <fieldset class="form-fieldset">
            <p class="form-details">این فرم آموزشی است: عضویت واقعی ثبت : نمیشود. فقط اطلاعات ساختگی وارد کنید؛ داده آزمایش در نشانی مرورگر دیده می‌شود.</p>
            <label for="name" class="form-label">نام و نام خانوادگی<span class="form-requirement"> (اجباری)</span></label>
            <input type="text" class="form-input">
        </fieldset>

        <fieldset class="form-fieldset">
            <label for="email" class="form-label">ایمیل<span class="form-requirement"> (اجباری)</span></label>
            <input type="text" class="form-input">
        </fieldset>

        <fieldset class="form-fieldset">
            <label for="phone" class="form-label">تلفن<span class="form-requirement"> (اختیاری)</span></label>
            <input type="text" class="form-input">
        </fieldset>
    </form>
</body>
</html>
